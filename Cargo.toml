[package]
name = "wallctl"
version = "0.2.0"
edition = "2021"
description = "A lightweight wallpaper rotation daemon for macOS and Cinnamon"
license = "MIT"
repository = "https://github.com/notafrogo/wallctl"
keywords = ["wallpaper", "cli", "macos", "cinnamon"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
rust-ini = "0.20"
dirs = "5.0"
rand = "0.8"
shellexpand = "3.1"
